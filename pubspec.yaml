name: van_mate_app
description: "Standalone Van Mate Flutter app."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: 6.3.0
  cloud_firestore: 6.2.0
  google_maps_flutter: 2.16.0
  geocoding: 4.0.0
  geolocator: 14.0.2
  google_mlkit_text_recognition: ^0.15.1
  image_cropper: ^12.2.1
  image_picker: ^1.2.1
  cloud_functions: ^6.2.0
  firebase_storage: ^13.0.0
  http: ^1.2.2
  url_launcher: 6.3.2
  share_plus: ^12.0.2
  pdf: ^3.11.3
  path_provider: ^2.1.5
  firebase_messaging: ^16.2.0
  shared_preferences: 2.3.2
  crypto: ^3.0.6
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/van_mate_van_login.png
    - assets/images/van_mate_van_home.png
